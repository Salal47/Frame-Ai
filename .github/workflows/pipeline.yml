name: Insta Uploader Pipeline v3.3

on:
  schedule:
    # Every 3 hours, on the hour (requirement: har 3 ghante bad chala)
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

concurrency:
  # requirement: agr aik action chal raha ho tu dusra parallel na chale.
  # cancel-in-progress:false means a second trigger QUEUES behind the
  # currently running one instead of running alongside it; only one run is
  # ever active at a time.
  group: insta-uploader-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 165   # 2.5h pipeline budget (below) + headroom to save state/upload before job's own timeout kills it
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg + fuse3 for rclone mount)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fuse3

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure Google Drive service account
        run: |
          mkdir -p "$HOME/.config/rclone"
          cat > "$HOME/gdrive-sa.json" <<'SAEOF'
          ${{ secrets.GDRIVE_SA_JSON }}
          SAEOF
          # Fail fast if the secret didn't come through as valid JSON
          # (e.g. empty secret, or newlines mangled by echo '...').
          python3 -c "import json,sys; json.load(open('$HOME/gdrive-sa.json'))" \
            || { echo "::error::GDRIVE_SA_JSON secret is missing or not valid JSON"; exit 1; }
          cat > "$HOME/.config/rclone/rclone.conf" <<EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = $HOME/gdrive-sa.json
          root_folder_id = ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          EOF

      - name: Sanity-check rclone can see the remote (no mount yet)
        run: |
          rclone lsd gdrive: -vv || {
            echo "::error::rclone cannot list the Drive remote — auth/config problem, not a FUSE problem. See log above.";
            exit 1;
          }

      - name: Mount Google Drive
        run: |
          mkdir -p /tmp/gdrive
          rclone mount gdrive: /tmp/gdrive \
            --daemon --vfs-cache-mode writes \
            --vfs-write-back 1s \
            --rc --rc-addr 127.0.0.1:5572 --rc-no-auth \
            --dir-cache-time 30s --poll-interval 15s \
            --log-file /tmp/rclone.log --log-level DEBUG

          # Poll instead of a flat sleep — retry for up to ~15s and bail
          # the moment the mount is confirmed, instead of racing a fixed delay.
          for i in $(seq 1 15); do
            if mountpoint -q /tmp/gdrive; then
              echo "Mounted after ${i}s"
              break
            fi
            sleep 1
          done

          if ! mountpoint -q /tmp/gdrive; then
            echo "::error::Drive mount failed"
            echo "----- rclone.log -----"
            cat /tmp/rclone.log || echo "(rclone.log is empty or missing — the daemon likely never started)"
            echo "----- fuse/device check -----"
            ls -la /dev/fuse || echo "/dev/fuse missing"
            which fusermount3 fusermount || echo "no fusermount binary on PATH"
            exit 1
          fi
          ls /tmp/gdrive

      - name: Run pipeline
        env:
          DRIVE_MOUNT_ROOT: /tmp/gdrive
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHUNKS_PER_FILE_PER_TURN: "3"
          MAX_RUN_MINUTES: "150"
          BROLL_RATIO: "0.4"
          PYTHONUNBUFFERED: "1"
          RCLONE_RC_ADDR: "http://127.0.0.1:5572"
        run: python -u main.py

      - name: Unmount Google Drive
        if: always()
        run: |
          curl -s -X POST http://127.0.0.1:5572/vfs/queue-wait -d '' || true
          sleep 3
          fusermount -u /tmp/gdrive || true
