name: Insta Uploader Pipeline v3.3

on:
  schedule:
    # Every 3 hours, on the hour (requirement: har 3 ghante bad chala)
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

concurrency:
  # requirement: agr aik action chal raha ho tu dusra parallel na chale.
  # cancel-in-progress:false means a second trigger QUEUES behind the
  # currently running one instead of running alongside it; only one run is
  # ever active at a time.
  group: insta-uploader-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 165   # 2.5h pipeline budget (below) + headroom to save state/upload before job's own timeout kills it
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg + fuse3 for rclone mount)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fuse3

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure Google Drive service account
        run: |
          mkdir -p "$HOME/.config/rclone"
          cat > "$HOME/gdrive-sa.json" <<'SAEOF'
          ${{ secrets.GDRIVE_SA_JSON }}
          SAEOF
          # Fail fast if the secret didn't come through as valid JSON
          # (e.g. empty secret, or newlines mangled by echo '...').
          python3 -c "import json,sys; json.load(open('$HOME/gdrive-sa.json'))" \
            || { echo "::error::GDRIVE_SA_JSON secret is missing or not valid JSON"; exit 1; }
          cat > "$HOME/.config/rclone/rclone.conf" <<EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = $HOME/gdrive-sa.json
          root_folder_id = ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          EOF

      - name: Sanity-check rclone can see the remote (no mount yet)
        run: |
          rclone lsd gdrive: -vv || {
            echo "::error::rclone cannot list the Drive remote — auth/config problem, not a FUSE problem. See log above.";
            exit 1;
          }

      - name: Mount Google Drive
        run: |
          mkdir -p /tmp/gdrive

          # NOTE: we deliberately do NOT use rclone's own --daemon flag.
          # --daemon makes rclone fork+re-exec itself, and that re-exec was
          # racing on the --rc-addr bind (the child tries to bind
          # 127.0.0.1:5572 while the parent still holds it open), which
          # killed the daemon with "address already in use" before the
          # mount ever completed. Backgrounding it ourselves with `&`
          # avoids the re-exec entirely — one process, one bind, no race.
          nohup rclone mount gdrive: /tmp/gdrive \
            --vfs-cache-mode writes \
            --vfs-write-back 1s \
            --rc --rc-addr 127.0.0.1:5572 --rc-no-auth \
            --dir-cache-time 30s --poll-interval 15s \
            --log-file /tmp/rclone.log --log-level DEBUG \
            > /tmp/rclone-stdout.log 2>&1 &
          echo $! > /tmp/rclone.pid

          # Poll instead of a flat sleep — retry for up to ~15s and bail
          # the moment the mount is confirmed, instead of racing a fixed delay.
          for i in $(seq 1 15); do
            if mountpoint -q /tmp/gdrive; then
              echo "Mounted after ${i}s"
              break
            fi
            sleep 1
          done

          if ! mountpoint -q /tmp/gdrive; then
            echo "::error::Drive mount failed"
            echo "----- rclone.log -----"
            cat /tmp/rclone.log || echo "(rclone.log is empty or missing — the daemon likely never started)"
            echo "----- fuse/device check -----"
            ls -la /dev/fuse || echo "/dev/fuse missing"
            which fusermount3 fusermount || echo "no fusermount binary on PATH"
            exit 1
          fi
          ls /tmp/gdrive

      - name: Run pipeline
        env:
          DRIVE_MOUNT_ROOT: /tmp/gdrive
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHUNKS_PER_FILE_PER_TURN: "3"
          MAX_RUN_MINUTES: "150"
          BROLL_RATIO: "0.4"
          PYTHONUNBUFFERED: "1"
          RCLONE_RC_ADDR: "http://127.0.0.1:5572"
        run: python -u main.py

      - name: Show rclone log (upload errors, quota issues, etc.)
        if: always()
        run: |
          echo "----- /tmp/rclone.log (last 300 lines) -----"
          tail -n 300 /tmp/rclone.log || echo "(rclone.log missing)"
          echo "----- quota / permission errors only -----"
          grep -iE "quota|permission|forbidden|error" /tmp/rclone.log || echo "(no matches)"

      - name: Wait for pending uploads, then unmount Google Drive
        if: always()
        run: |
          # NOTE: "vfs/queue-wait" is not a real rclone rc method (it 404s
          # every time — "couldn't find method"), so it was never actually
          # waiting for anything. The real endpoint is "vfs/queue", which
          # lists what's still pending write-back to Drive. Poll it until
          # empty (or we give up) so we don't force-unmount while chunks
          # are still sitting in the local cache, unuploaded.
          echo "Waiting for rclone VFS write-back queue to drain..."
          deadline=$((SECONDS + 180))
          while [ $SECONDS -lt $deadline ]; do
            queue=$(curl -s -X POST http://127.0.0.1:5572/vfs/queue || echo '{}')
            pending=$(echo "$queue" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get('queue') or []))" 2>/dev/null || echo "0")
            if [ "$pending" = "0" ]; then
              echo "Queue drained after ${SECONDS}s."
              break
            fi
            echo "  still ${pending} item(s) pending upload... (${SECONDS}s elapsed)"
            sleep 5
          done
          if [ $SECONDS -ge $deadline ]; then
            echo "::warning::Gave up waiting for the VFS queue to drain after 180s — some files may not have reached Drive."
          fi
          fusermount -u /tmp/gdrive || true

      - name: Upload rclone log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rclone-log-${{ github.run_id }}
          path: /tmp/rclone.log
          retention-days: 7
